name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download openFrameworks
        run: |
          $url = "https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_vs_release.zip"
          Invoke-WebRequest -Uri $url -OutFile "of.zip" -TimeoutSec 300
          Expand-Archive -Path "of.zip" -DestinationPath "C:\" -Force
          Rename-Item "C:\of_v0.12.0_vs_release" "C:\of"
        shell: pwsh

      - name: Link project into OF tree
        run: |
          New-Item -ItemType Directory -Force "C:\of\apps\myApps"
          New-Item -ItemType Junction -Path "C:\of\apps\myApps\midivfx" -Target "$env:GITHUB_WORKSPACE"
        shell: pwsh

      - name: Clone addons
        run: |
          git clone https://github.com/danomatika/ofxMidi.git C:\of\addons\ofxMidi
          git clone https://github.com/bgstaal/ofxMidifile.git C:\of\addons\ofxMidifile
          git clone https://github.com/P-A-N/ofxBloom.git C:\of\addons\ofxBloom

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: |
          msbuild "C:\of\apps\myApps\midivfx\midivfx.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /clp:ErrorsOnly
        shell: pwsh

      - name: List OF export folder
        run: Get-ChildItem "C:\of\export" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
        shell: pwsh

      - name: Collect release files
        run: |
          $bin = "C:\of\apps\myApps\midivfx\bin"
          $out = "$env:GITHUB_WORKSPACE\release-windows"
          New-Item -ItemType Directory -Path $out

          Copy-Item "$bin\midivfx.exe" $out

          # OF runtime DLLs (FreeImage, fmod, etc.) from the release zip's export folder
          Get-ChildItem "C:\of\export\vs\libs\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $out

          # Any extra DLLs copied into bin by the build
          Get-ChildItem "$bin\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $out

          # VC++ 2022 runtime DLLs so users don't need the redistributable installed
          $vctools = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          $runtime = "$vctools\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT"
          Get-ChildItem $runtime -ErrorAction SilentlyContinue | Select-Object -Last 1 | `
            Get-ChildItem -Filter "*.dll" | Copy-Item -Destination $out
        shell: pwsh

      - name: Zip release
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "release-windows\*" -DestinationPath "midivfx-windows-x64-$tag.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midivfx-windows-x64
          path: midivfx-windows-x64-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: midivfx-windows-x64-*.zip
          generate_release_notes: true
