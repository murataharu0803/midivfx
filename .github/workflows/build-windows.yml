name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download openFrameworks
        run: |
          $url = "https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_vs_release.zip"
          Invoke-WebRequest -Uri $url -OutFile "of.zip" -TimeoutSec 300
          Expand-Archive -Path "of.zip" -DestinationPath "C:\" -Force
          Rename-Item "C:\of_v0.12.0_vs_release" "C:\of"
        shell: pwsh

      - name: Link project into OF tree
        run: |
          New-Item -ItemType Directory -Force "C:\of\apps\myApps"
          New-Item -ItemType Junction -Path "C:\of\apps\myApps\midivfx" -Target "$env:GITHUB_WORKSPACE"
        shell: pwsh

      - name: Clone ofxMidi
        run: git clone https://github.com/danomatika/ofxMidi.git C:\of\addons\ofxMidi

      - name: Clone ofxMidifile
        run: git clone https://github.com/bgstaal/ofxMidifile.git C:\of\addons\ofxMidifile

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: |
          msbuild "C:\of\apps\myApps\midivfx\midivfx.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /clp:ErrorsOnly
        shell: pwsh

      - name: Collect release files
        run: |
          $bin = "C:\of\apps\myApps\midivfx\bin"
          $out = "$env:GITHUB_WORKSPACE\release-windows"
          New-Item -ItemType Directory -Path $out

          Copy-Item "$bin\midivfx.exe" $out
          Get-ChildItem "$bin\*.dll" | Copy-Item -Destination $out
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midivfx-windows-x64
          path: release-windows/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-windows/**
          generate_release_notes: true
